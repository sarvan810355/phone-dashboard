<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Project Agent</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #08080c;
    --bg-grad: radial-gradient(1200px 500px at 50% -10%, rgba(124,108,246,0.16), transparent 60%);
    --surface: #131319;
    --surface-2: #1a1a22;
    --surface-3: #21212b;
    --border: #26262f;
    --border-soft: #1e1e26;
    --text: #f2f3f7;
    --text-dim: #9a9dac;
    --text-faint: #64677a;
    --accent: #7c6cf6;
    --accent-2: #a78bfa;
    --accent-grad: linear-gradient(135deg, #7c6cf6, #b06ae0);
    --success: #34d399;
    --success-bg: #0f2a22;
    --warning: #fbbf24;
    --warning-bg: #2c2310;
    --danger: #f87171;
    --danger-bg: #2a1417;
    --info: #60a5fa;
    --info-bg: #12233a;
    --radius: 16px;
    --radius-sm: 10px;
    --shadow: 0 8px 24px rgba(0,0,0,0.35);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 20px 16px 70px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg) var(--bg-grad) no-repeat;
    background-attachment: fixed;
    color: var(--text);
    max-width: 720px; margin-inline: auto;
    -webkit-font-smoothing: antialiased;
  }
  h1 { font-size: 1.4rem; margin: 0; font-weight: 700; letter-spacing: -0.01em; }
  h2 { font-size: 1.2rem; margin: 0; font-weight: 700; letter-spacing: -0.01em; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark {
    width: 34px; height: 34px; border-radius: 10px; background: var(--accent-grad);
    display: flex; align-items: center; justify-content: center; font-size: 1.05rem;
    box-shadow: 0 4px 14px rgba(124,108,246,0.4); flex: 0 0 auto;
  }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px 18px; margin-bottom: 12px; box-shadow: var(--shadow);
  }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .name { font-weight: 600; font-size: 1.05rem; }

  .badge {
    font-size: 0.68rem; font-weight: 600; padding: 4px 10px; border-radius: 999px;
    background: var(--surface-3); color: var(--text-dim); white-space: nowrap; flex: 0 0 auto;
    letter-spacing: 0.02em; text-transform: uppercase; display: inline-flex; align-items: center; gap: 5px;
  }
  .badge::before { content: ''; width: 6px; height: 6px; border-radius: 999px; background: currentColor; opacity: 0.9; }
  .badge.running { background: var(--success-bg); color: var(--success); }
  .badge.waiting, .badge.blocked { background: var(--warning-bg); color: var(--warning); }
  .badge.completed { background: var(--info-bg); color: var(--info); }
  .badge.failed { background: var(--danger-bg); color: var(--danger); }

  .meta { font-size: 0.85rem; color: var(--text-dim); margin-top: 6px; line-height: 1.6; }
  .meta a { color: var(--accent-2); text-decoration: none; }
  .resume {
    font-size: 0.82rem; color: #c9cfd6; margin-top: 10px; background: var(--surface-2);
    border: 1px solid var(--border-soft); padding: 10px 12px; border-radius: var(--radius-sm); line-height: 1.5;
  }

  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  button {
    flex: 1; min-width: 80px; padding: 11px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border);
    background: var(--surface-3); color: var(--text); font-size: 0.85rem; font-weight: 600;
    transition: transform 0.05s ease, background 0.15s ease; font-family: inherit;
  }
  button:active { transform: scale(0.97); background: #292933; }
  button.primary { background: var(--accent-grad); color: white; border: none; box-shadow: 0 4px 14px rgba(124,108,246,0.35); }
  button.ghost { background: transparent; border: 1px solid var(--border); }

  .addbox { display: none; flex-direction: column; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--border); }
  .addbox.open { display: flex; }
  input, textarea, select {
    width: 100%; background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    border-radius: var(--radius-sm); padding: 11px 12px; font-size: 0.9rem; font-family: inherit;
    transition: border-color 0.15s ease;
  }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); }
  ::placeholder { color: var(--text-faint); }

  .empty { color: var(--text-faint); text-align: center; padding: 48px 16px; font-size: 0.9rem; }
  .empty .big { font-size: 2rem; margin-bottom: 8px; }

  #status {
    position: fixed; bottom: 14px; left: 16px; right: 16px; text-align: center; font-size: 0.72rem;
    color: var(--text-faint); pointer-events: none; z-index: 5;
  }
  .gear {
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text-dim); font-size: 1.05rem;
    flex: 0 0 auto; min-width: auto; width: 40px; height: 40px; padding: 0; border-radius: 12px;
  }
  .setup { display: flex; flex-direction: column; gap: 10px; }
  .setup label { font-size: 0.78rem; color: var(--text-dim); font-weight: 600; margin-top: 2px; }
  .hint { font-size: 0.76rem; color: var(--text-faint); line-height: 1.55; margin-top: 6px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .back {
    background: none; border: none; color: var(--accent-2); font-size: 0.9rem; font-weight: 600;
    padding: 6px 0; min-width: auto; flex: 0 0 auto; text-align: left;
  }

  /* usage / credit card */
  .usage-card { background: linear-gradient(160deg, var(--surface) 0%, #171724 100%); }
  .usage-top { display: flex; justify-content: space-between; align-items: baseline; }
  .usage-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-faint); font-weight: 700; }
  .usage-num { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; }
  .usage-num small { font-size: 0.85rem; color: var(--text-dim); font-weight: 500; }
  .usage-bar { height: 8px; border-radius: 999px; background: var(--surface-3); margin-top: 10px; overflow: hidden; }
  .usage-fill { height: 100%; background: var(--accent-grad); border-radius: 999px; transition: width 0.4s ease; }
  .usage-note { font-size: 0.72rem; color: var(--text-faint); margin-top: 8px; }

  /* project list rows */
  .plist { display: flex; flex-direction: column; gap: 10px; }
  .prow {
    display: flex; align-items: center; gap: 12px;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px; cursor: pointer; box-shadow: var(--shadow);
    transition: transform 0.08s ease, border-color 0.15s ease;
  }
  .prow:active { transform: scale(0.985); border-color: var(--accent); }
  .pavatar {
    width: 40px; height: 40px; border-radius: 12px; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 1rem; color: white;
  }
  .prow-body { flex: 1; min-width: 0; }
  .prow .name { font-size: 0.98rem; }
  .prow .sub { font-size: 0.78rem; color: var(--text-faint); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pbar { height: 4px; border-radius: 999px; background: var(--surface-3); margin-top: 8px; overflow: hidden; }
  .pbar-fill { height: 100%; background: var(--accent-grad); border-radius: 999px; }
  .prow-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex: 0 0 auto; }
  .chev { color: var(--text-faint); font-size: 1.2rem; flex: 0 0 auto; }

  .sectiontitle {
    font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-faint);
    margin: 22px 2px 10px; font-weight: 700; display: flex; align-items: center; gap: 6px;
  }
  .tasklist { display: flex; flex-direction: column; gap: 7px; }
  .taskrow {
    background: var(--surface-2); border: 1px solid var(--border-soft); border-radius: var(--radius-sm);
    padding: 10px 12px; font-size: 0.85rem;
  }
  .taskrow .ttitle { font-weight: 500; }
  .taskrow .tstatus {
    font-size: 0.66rem; color: var(--text-faint); margin-left: 6px; text-transform: uppercase;
    letter-spacing: 0.03em; font-weight: 700;
  }

  .fieldrow { display: flex; gap: 6px; align-items: stretch; }
  .fieldrow input, .fieldrow textarea { flex: 1; }
  .mic {
    flex: 0 0 auto; width: 44px; min-width: 44px; padding: 0; font-size: 1.1rem;
    background: var(--surface-3); border-radius: var(--radius-sm);
  }
  .mic.listening { background: var(--danger-bg); color: #ff8a8a; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
  .attachrow { display: flex; gap: 8px; flex-wrap: wrap; }
  .filebtn {
    flex: 1; min-width: 130px; text-align: center; padding: 11px 10px; border-radius: var(--radius-sm);
    background: var(--surface-3); border: 1px solid var(--border); color: var(--text); font-size: 0.82rem;
    font-weight: 600; cursor: pointer;
  }
  .filebtn:active { background: #292933; }
  .errorrow { background: var(--danger-bg); border: 1px solid #3a1620; }
  .errortext { color: #f0a3b3; font-size: 0.78rem; margin-top: 4px; white-space: pre-wrap; }
  .actrow { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .actstatus { font-size: 0.68rem; padding: 3px 9px; border-radius: 999px; flex: 0 0 auto; font-weight: 700; text-transform: uppercase; }
  .actstatus.success { background: var(--success-bg); color: var(--success); }
  .actstatus.failure { background: var(--danger-bg); color: var(--danger); }
  .actstatus.in_progress, .actstatus.queued { background: var(--warning-bg); color: var(--warning); }
  .acttime { font-size: 0.72rem; color: var(--text-faint); }
</style>
</head>
<body>

<div id="app"></div>
<div id="status"></div>

<script>
const CFG_KEY = 'pa_config';
function getConfig() { try { return JSON.parse(localStorage.getItem(CFG_KEY)) || {}; } catch { return {}; } }
function setConfig(c) { localStorage.setItem(CFG_KEY, JSON.stringify(c)); }

const DATA_DIR = 'projects';
const WORKFLOW = 'agent.yml';
const FREE_MINUTES_PER_MONTH = 2000;
const AVATAR_COLORS = ['#7c6cf6', '#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#ec4899', '#06b6d4', '#8b5cf6'];

function gh(path, opts = {}) {
  const c = getConfig();
  if (!c.owner || !c.repo || !c.token) throw new Error('पहले ⚙ में owner/repo/token भरें');
  return fetch(`https://api.github.com/repos/${c.owner}/${c.repo}${path}`, {
    method: opts.method || 'GET',
    headers: {
      Authorization: `Bearer ${c.token}`,
      Accept: 'application/vnd.github+json',
      ...(opts.body ? { 'Content-Type': 'application/json' } : {}),
    },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
}

async function listProjectIds() {
  const res = await gh(`/contents/${DATA_DIR}`);
  if (res.status === 404) return [];
  if (!res.ok) throw new Error('project list: ' + res.status);
  const items = await res.json();
  return items.filter((i) => i.type === 'dir').map((i) => i.name);
}

async function loadProject(id) {
  const res = await gh(`/contents/${DATA_DIR}/${id}/state.json`);
  if (!res.ok) return null;
  const file = await res.json();
  return JSON.parse(decodeURIComponent(escape(atob(file.content))));
}

async function dispatch(inputs) {
  const res = await gh(`/actions/workflows/${WORKFLOW}/dispatches`, {
    method: 'POST',
    body: { ref: 'main', inputs },
  });
  if (!res.ok) {
    const t = await res.text();
    throw new Error('trigger failed: ' + res.status + ' ' + t);
  }
}

function timeAgo(iso) {
  const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return s + 's पहले';
  if (s < 3600) return Math.floor(s / 60) + 'm पहले';
  if (s < 86400) return Math.floor(s / 3600) + 'h पहले';
  return Math.floor(s / 86400) + 'd पहले';
}

function avatarColor(id) {
  let h = 0;
  for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0;
  return AVATAR_COLORS[h % AVATAR_COLORS.length];
}

// Shows recent cloud runs (queued/in-progress/success/failure) so the user
// can see *what's actually happening right now*, not just the state.json
// snapshot from after a run finishes — this is the "kaunsa step chal raha
// hai" visibility that pure state polling can't give.
async function loadActivity(projectId) {
  const el = document.getElementById('activity-' + projectId);
  if (!el) return;
  try {
    const res = await gh(`/actions/workflows/${WORKFLOW}/runs?per_page=6`);
    if (!res.ok) { el.innerHTML = '<div class="taskrow">Activity load नहीं हो पाई</div>'; return; }
    const data = await res.json();
    const rows = data.workflow_runs.slice(0, 6).map((r) => {
      const st = r.status === 'completed' ? r.conclusion : r.status;
      return `<div class="taskrow actrow">
        <span>Run #${r.run_number}</span>
        <span class="acttime">${timeAgo(r.created_at)}</span>
        <span class="actstatus ${st}">${st}</span>
      </div>`;
    }).join('');
    el.innerHTML = rows || '<div class="taskrow">अभी तक कोई run नहीं</div>';
  } catch (e) {
    el.innerHTML = `<div class="taskrow">Activity error: ${esc(e.message)}</div>`;
  }
}

// GitHub's real Actions-minutes billing API isn't reachable from this
// account/token (404 on the free personal-account endpoint) and Claude has
// no usage API at all — so this is a client-computed ESTIMATE from recent
// run wall-clock time, not an official number. Labeled as such in the UI.
async function loadUsageEstimate() {
  const el = document.getElementById('usage-card');
  if (!el) return;
  try {
    const res = await gh(`/actions/workflows/${WORKFLOW}/runs?per_page=100`);
    if (!res.ok) { el.innerHTML = '<div class="usage-note">Usage load नहीं हो पाया</div>'; return; }
    const data = await res.json();
    const now = new Date();
    const monthStart = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
    let minutes = 0, runsThisMonth = 0;
    for (const r of data.workflow_runs) {
      const started = new Date(r.run_started_at || r.created_at).getTime();
      if (started < monthStart) continue;
      const ended = r.status === 'completed' ? new Date(r.updated_at).getTime() : Date.now();
      minutes += Math.max(0, (ended - started) / 60000);
      runsThisMonth++;
    }
    minutes = Math.round(minutes);
    const pct = Math.min(100, Math.round((minutes / FREE_MINUTES_PER_MONTH) * 100));
    el.innerHTML = `
      <div class="usage-top">
        <span class="usage-label">इस महीने Cloud Usage</span>
        <span class="usage-label">${runsThisMonth} runs</span>
      </div>
      <div class="usage-num">${minutes}<small> / ${FREE_MINUTES_PER_MONTH} min</small></div>
      <div class="usage-bar"><div class="usage-fill" style="width:${pct}%"></div></div>
      <div class="usage-note">अनुमानित है (run के actual समय से calculate) — GitHub का असली billing API इस account पर उपलब्ध नहीं है, यह exact नहीं बल्कि करीबी संख्या है।</div>
    `;
  } catch (e) {
    el.innerHTML = `<div class="usage-note">Usage error: ${esc(e.message)}</div>`;
  }
}

function badgeClass(status) {
  if (['RUNNING', 'READY'].includes(status)) return 'running';
  if (['WAITING_FOR_RESOURCE', 'WAITING_FOR_USER', 'BLOCKED', 'PAUSED'].includes(status)) return 'waiting';
  if (status === 'COMPLETED') return 'completed';
  if (status === 'FAILED') return 'failed';
  return '';
}

function setStatus(msg) { document.getElementById('status').textContent = msg; }
function esc(s) { return (s || '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// ---------- routing ----------
function currentRoute() {
  const h = location.hash.replace(/^#/, '');
  if (h.startsWith('project/')) return { view: 'detail', id: decodeURIComponent(h.slice(8)) };
  return { view: 'list' };
}
function goTo(hash) { location.hash = hash; }
window.addEventListener('hashchange', render);

let projectsCache = [];

async function refreshData() {
  try {
    const ids = await listProjectIds();
    projectsCache = (await Promise.all(ids.map(loadProject))).filter(Boolean);
    setStatus('updated ' + new Date().toLocaleTimeString());
  } catch (e) {
    setStatus('error: ' + e.message);
  }
  // Don't wipe out whatever the user is currently typing (e.g. a new
  // project id or task title) when a background refresh lands mid-type.
  const active = document.activeElement;
  const isTyping = active && ['INPUT', 'TEXTAREA'].includes(active.tagName) && document.getElementById('app').contains(active);
  if (!isTyping) render();
}

// ---------- views ----------
function projectProgress(p) {
  const done = p.COMPLETED_TASKS.length;
  const total = done + p.TASK_QUEUE.length + (p.FAILED_TASKS || []).length;
  return total ? Math.round((done / total) * 100) : 0;
}

function renderList() {
  const app = document.getElementById('app');
  const rows = projectsCache.map((p) => {
    const initial = (p.PROJECT_NAME || p.PROJECT_ID || '?').trim().charAt(0).toUpperCase();
    const pct = projectProgress(p);
    return `
    <div class="prow" onclick="goTo('project/${encodeURIComponent(p.PROJECT_ID)}')">
      <div class="pavatar" style="background:${avatarColor(p.PROJECT_ID)}">${initial}</div>
      <div class="prow-body">
        <div class="name">${esc(p.PROJECT_NAME)}</div>
        <div class="sub">${p.CURRENT_TASK ? esc(p.CURRENT_TASK.TITLE) : (p.NEXT_TASK ? 'Next: ' + esc(p.NEXT_TASK) : 'कोई task queued नहीं')}</div>
        <div class="pbar"><div class="pbar-fill" style="width:${pct}%"></div></div>
      </div>
      <div class="prow-right">
        <span class="badge ${badgeClass(p.PROJECT_STATUS)}">${p.PROJECT_STATUS}</span>
        <span class="chev">›</span>
      </div>
    </div>
  `;
  }).join('');

  app.innerHTML = `
    <div class="topbar">
      <div class="brand"><div class="brand-mark">⚡</div><h1>Project Agent</h1></div>
      <button class="gear" onclick="toggleSetup()">⚙</button>
    </div>

    <div class="card usage-card" id="usage-card">
      <div class="usage-note">Usage लोड हो रहा है…</div>
    </div>

    <div id="setupCard" class="card setup" style="display:none">
      <label>GitHub username/org</label>
      <input id="cfgOwner" placeholder="e.g. sarvan810355">
      <label>Repo name (the private data repo)</label>
      <input id="cfgRepo" placeholder="e.g. cloud-orchestrator">
      <label>Personal Access Token</label>
      <input id="cfgToken" type="password" placeholder="github_pat_...">
      <div class="hint">Token सिर्फ आपके फोन के browser में रहता है — सीधे GitHub API को जाता है।</div>
      <button class="primary" onclick="saveConfig()">Save</button>
    </div>

    <div class="card setup">
      <label>Project id (e.g. parental_control)</label>
      <input id="npId" placeholder="project id">
      <label>GitHub repo link (पहले खाली repo बना लें — owner/repo, जैसे sarvan810355/parental-control)</label>
      <input id="npRepo" placeholder="owner/repo">
      <label>App का title और पूरा plan (क्या बनाना है, कैसे काम करना चाहिए)</label>
      <div class="fieldrow">
        <textarea id="npPlan" rows="4" placeholder="जैसे: Parental Control app — parents apne bacchon ka screen time track kar sakein, daily app usage limit laga sakein, limit paar hone par notification bheje..."></textarea>
        <button type="button" class="mic" id="mic-npPlan" onclick="startVoice('npPlan')">🎤</button>
      </div>
      <button class="primary" onclick="createProject()">+ New Project — बनाना शुरू करें</button>
      <div class="hint">Plan डालते ही project बनेगा, पहला task queue होगा, और Autonomous mode अपने-आप चालू हो जाएगा — Claude scratch से app बनाना शुरू कर देगा।</div>
    </div>

    <div class="sectiontitle">आपके Projects · ${projectsCache.length}</div>
    <div class="plist">${rows || '<div class="empty"><div class="big">📁</div>कोई project नहीं है।<br>ऊपर से नया बनाएं।</div>'}</div>
  `;

  const c = getConfig();
  document.getElementById('cfgOwner').value = c.owner || '';
  document.getElementById('cfgRepo').value = c.repo || '';
  document.getElementById('cfgToken').value = c.token || '';
  if (!c.token) document.getElementById('setupCard').style.display = 'flex';
  loadUsageEstimate();
}

function renderDetail(id) {
  const app = document.getElementById('app');
  const p = projectsCache.find((x) => x.PROJECT_ID === id);
  if (!p) {
    app.innerHTML = `<button class="back" onclick="goTo('')">‹ वापस</button><div class="empty">Project नहीं मिला, refresh करें।</div>`;
    return;
  }

  const queueRows = p.TASK_QUEUE.map((t) => `
    <div class="taskrow"><span class="ttitle">${esc(t.TITLE)}</span><span class="tstatus">${t.STATUS}</span></div>
  `).join('') || '<div class="taskrow">कोई task queued नहीं</div>';

  const doneRows = p.COMPLETED_TASKS.slice().reverse().map((t) => `
    <div class="taskrow"><span class="ttitle">✓ ${esc(t.TITLE)}</span></div>
  `).join('') || '<div class="taskrow">अभी तक कुछ पूरा नहीं हुआ</div>';

  const failedRows = (p.FAILED_TASKS || []).slice().reverse().map((t) => `
    <div class="taskrow errorrow">
      <div class="ttitle">✗ ${esc(t.TITLE)}</div>
      ${(t.ERRORS || []).slice(-1).map((e) => `<div class="errortext">${esc(e)}</div>`).join('')}
    </div>
  `).join('');

  app.innerHTML = `
    <button class="back" onclick="goTo('')">‹ सारे projects</button>
    <div class="topbar" style="margin-top:10px">
      <div class="brand">
        <div class="pavatar" style="background:${avatarColor(p.PROJECT_ID)}">${esc((p.PROJECT_NAME || '?').charAt(0).toUpperCase())}</div>
        <h2>${esc(p.PROJECT_NAME)}</h2>
      </div>
      <span class="badge ${badgeClass(p.PROJECT_STATUS)}">${p.PROJECT_STATUS}</span>
    </div>
    <div class="card">
      <div class="meta">
        Current: ${p.CURRENT_TASK ? esc(p.CURRENT_TASK.TITLE) : '—'}<br>
        Next: ${p.NEXT_TASK || '—'}<br>
        Code repo: ${p.REPO ? `<a href="https://github.com/${p.REPO}" target="_blank">${p.REPO}</a>` : 'not linked'}<br>
        Autonomous mode: <b style="color:${p.AUTONOMOUS_MODE ? 'var(--success)' : 'var(--text-dim)'}">${p.AUTONOMOUS_MODE ? 'ON — काम खुद चलता रहेगा' : 'OFF'}</b>
      </div>
      ${p.RESUME_POINT ? `<div class="resume">${esc(p.RESUME_POINT)}</div>` : ''}
      <div class="actions">
        <button onclick="work('${p.PROJECT_ID}')">Work (1 task)</button>
        <button onclick="autoRun('${p.PROJECT_ID}')">Auto</button>
        <button onclick="toggleAdd('${p.PROJECT_ID}')">+ Task</button>
      </div>
      <div class="actions">
        <button class="${p.AUTONOMOUS_MODE ? 'ghost' : 'primary'}" onclick="toggleAutonomous('${p.PROJECT_ID}', ${!p.AUTONOMOUS_MODE})">${p.AUTONOMOUS_MODE ? 'Autonomous बंद करें' : 'Autonomous चालू करें'}</button>
      </div>
      <div class="addbox" id="add-${p.PROJECT_ID}">
        <div class="fieldrow">
          <input id="title-${p.PROJECT_ID}" placeholder="Task title">
          <button type="button" class="mic" id="mic-title-${p.PROJECT_ID}" onclick="startVoice('title-${p.PROJECT_ID}')">🎤</button>
        </div>
        <div class="fieldrow">
          <textarea id="desc-${p.PROJECT_ID}" rows="2" placeholder="Description"></textarea>
          <button type="button" class="mic" id="mic-desc-${p.PROJECT_ID}" onclick="startVoice('desc-${p.PROJECT_ID}')">🎤</button>
        </div>
        <div class="attachrow">
          <label class="filebtn">📷 Screenshots
            <input type="file" id="shots-${p.PROJECT_ID}" accept="image/*" multiple style="display:none" onchange="renderAttachList('${p.PROJECT_ID}')">
          </label>
          <label class="filebtn">🎥 Screen recording
            <input type="file" id="rec-${p.PROJECT_ID}" accept="video/*" style="display:none" onchange="renderAttachList('${p.PROJECT_ID}')">
          </label>
        </div>
        <div class="hint" id="attachlist-${p.PROJECT_ID}"></div>
        <button class="primary" onclick="addTask('${p.PROJECT_ID}')">Add task</button>
      </div>
      <div class="actions">
        <button onclick="downloadApk('${p.PROJECT_ID}')">📥 Download APK</button>
      </div>
    </div>

    ${failedRows ? `<div class="sectiontitle" style="color:var(--danger)">Failed · ${p.FAILED_TASKS.length}</div><div class="tasklist">${failedRows}</div>` : ''}

    <div class="sectiontitle">Queue · ${p.TASK_QUEUE.length}</div>
    <div class="tasklist">${queueRows}</div>

    <div class="sectiontitle">Completed · ${p.COMPLETED_TASKS.length}</div>
    <div class="tasklist">${doneRows}</div>

    <div class="sectiontitle">Cloud Activity (सभी projects की, filter नहीं है)</div>
    <div class="tasklist" id="activity-${p.PROJECT_ID}"><div class="taskrow">लोड हो रहा है…</div></div>
  `;
  loadActivity(p.PROJECT_ID);
}

function render() {
  const r = currentRoute();
  if (r.view === 'detail') renderDetail(r.id);
  else renderList();
}

// ---------- actions ----------
function toggleSetup() {
  const card = document.getElementById('setupCard');
  card.style.display = card.style.display === 'none' ? 'flex' : 'none';
}
function saveConfig() {
  setConfig({
    owner: document.getElementById('cfgOwner').value.trim(),
    repo: document.getElementById('cfgRepo').value.trim(),
    token: document.getElementById('cfgToken').value.trim(),
  });
  refreshData();
}
function toggleAdd(id) { document.getElementById('add-' + id).classList.toggle('open'); }

async function toggleAutonomous(id, enable) {
  setStatus((enable ? 'Autonomous चालू' : 'Autonomous बंद') + ' किया जा रहा है…');
  await dispatch({ action: enable ? 'autonomous-on' : 'autonomous-off', projectId: id });
  setStatus('हो गया — ~30-60s में state update होगा।');
}

function renderAttachList(id) {
  const shots = document.getElementById('shots-' + id).files;
  const rec = document.getElementById('rec-' + id).files;
  const parts = [];
  for (const f of shots) parts.push(`📷 ${f.name} (${Math.round(f.size / 1024)} KB)`);
  for (const f of rec) parts.push(`🎥 ${f.name} (${Math.round(f.size / 1024 / 1024)} MB)`);
  document.getElementById('attachlist-' + id).textContent = parts.join(', ');
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// Uploads an attachment straight into the data repo (needs the dashboard's
// token to have Contents:Write, not just Read) so it's sitting right there
// in the checked-out workspace when Claude Code runs the task — it can just
// Read the file path like any other file in the repo.
async function uploadAttachment(projectId, stagingId, file) {
  const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
  const path = `${DATA_DIR}/${projectId}/attachments/${stagingId}/${safeName}`;
  const content = await fileToBase64(file);
  const res = await gh(`/contents/${path}`, {
    method: 'PUT',
    body: { message: `attach: ${safeName}`, content },
  });
  if (!res.ok) throw new Error(`upload failed for ${file.name}: ${res.status}`);
  return path;
}

async function addTask(id) {
  const title = document.getElementById('title-' + id).value.trim();
  let description = document.getElementById('desc-' + id).value.trim();
  if (!title) return;
  const shots = [...document.getElementById('shots-' + id).files];
  const rec = [...document.getElementById('rec-' + id).files];
  const allFiles = [...shots, ...rec];

  if (allFiles.length) {
    const stagingId = 'a' + Date.now();
    setStatus(`${allFiles.length} file upload हो रही हैं…`);
    try {
      const paths = [];
      for (const f of allFiles) paths.push(await uploadAttachment(id, stagingId, f));
      description += `\n\nAttached files (Read tool से देखें, ये उसी checked-out repo में मौजूद हैं):\n` + paths.map((p) => `- ${p}`).join('\n');
    } catch (e) {
      setStatus('Attachment upload error: ' + e.message);
      return;
    }
  }

  setStatus('queuing task on GitHub Actions…');
  await dispatch({ action: 'add-task', projectId: id, title, description });
  setStatus('task queued — ~30-60s में state update होगा।');
}

// project id becomes a filesystem folder name and a URL fragment — force it
// to a safe slug (letters/numbers/_/- only) instead of trusting free text.
function slugify(s) {
  return s.trim().toLowerCase().replace(/[^a-z0-9_-]+/g, '_').replace(/^_+|_+$/g, '');
}

// Accepts a pasted full GitHub URL too, not just "owner/repo".
function normalizeRepo(s) {
  s = s.trim().replace(/\.git$/, '').replace(/\/$/, '');
  const m = s.match(/github\.com[/:]([^/]+\/[^/]+)$/i);
  return m ? m[1] : s;
}

async function createProject() {
  const rawId = document.getElementById('npId').value.trim();
  const rawRepo = document.getElementById('npRepo').value.trim();
  const plan = document.getElementById('npPlan').value.trim();
  if (!rawId) return;
  const id = slugify(rawId);
  const repo = rawRepo ? normalizeRepo(rawRepo) : '';
  if (id !== rawId) setStatus(`project id को safe बना दिया: "${id}"`);

  setStatus('शुरू कर रहा हूं…');
  if (plan) {
    // One single action does init + add-task + autonomous-on atomically —
    // firing these as 3 separate dispatches back to back doesn't work
    // reliably (GitHub's concurrency queue only keeps the newest pending
    // run per project, silently cancelling the ones in between).
    await dispatch({ action: 'init-and-start', projectId: id, repo, title: `Build: ${id}`, description: plan });
    setStatus('शुरू हो गया — cloud में project बन रहा है, यहीं wait कीजिए…');
  } else {
    await dispatch({ action: 'init', projectId: id, repo });
    setStatus('project create queued — cloud में बन रहा है, यहीं wait कीजिए…');
  }

  document.getElementById('npId').value = '';
  document.getElementById('npRepo').value = '';
  document.getElementById('npPlan').value = '';
  waitForNewProject(id);
}

// Polls quickly (every 4s, up to 2 minutes) right after creating a project
// instead of waiting for the normal 20s background refresh, and jumps
// straight to its detail page — with a fresh project, waiting is otherwise
// the entire experience, so make that wait visible and short.
async function waitForNewProject(id, attempt = 0) {
  await refreshData();
  if (projectsCache.some((p) => p.PROJECT_ID === id)) {
    setStatus('project बन गया!');
    goTo('project/' + encodeURIComponent(id));
    return;
  }
  if (attempt >= 30) { setStatus('अभी तक नहीं दिखा — cloud में देर हो रही है, थोड़ी देर बाद manually refresh करें।'); return; }
  setStatus(`cloud में बन रहा है… (check ${attempt + 1}/30)`);
  setTimeout(() => waitForNewProject(id, attempt + 1), 4000);
}

async function work(id) { setStatus('running one task cycle in the cloud…'); await dispatch({ action: 'work', projectId: id }); setStatus('cycle queued — ~30-90s में repo update होगा।'); }
async function autoRun(id) { setStatus('running cycles in the cloud…'); await dispatch({ action: 'auto', projectId: id, maxCycles: '20' }); setStatus('auto run queued — कुछ मिनट लग सकते हैं।'); }

// ---------- voice input ----------
function startVoice(fieldId) {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) { setStatus('इस browser में voice input support नहीं है (Chrome try करें)'); return; }
  const rec = new SpeechRecognition();
  rec.lang = (navigator.language && navigator.language.startsWith('hi')) ? 'hi-IN' : 'en-IN';
  rec.interimResults = false;
  rec.maxAlternatives = 1;
  const btn = document.getElementById('mic-' + fieldId);
  const field = document.getElementById(fieldId);
  if (btn) btn.classList.add('listening');
  setStatus('सुन रहा हूं… बोलिए');
  rec.onresult = (e) => {
    const text = e.results[0][0].transcript;
    if (field) field.value = (field.value ? field.value.trim() + ' ' : '') + text;
    setStatus('voice text जोड़ा गया');
  };
  rec.onerror = (e) => setStatus('voice error: ' + e.error);
  rec.onend = () => { if (btn) btn.classList.remove('listening'); };
  rec.start();
}

// ---------- APK download ----------
// APKs are published as a GitHub Release on the public phone-dashboard repo
// (tag apk-<projectId>), not committed to git (avoids the 100MB blob limit)
// and not on the private project repo (avoids the CORS-on-private-asset
// problem). Being a public-repo release, the asset needs no auth — a plain
// link triggers a normal browser-native download.
async function downloadApk(id) {
  setStatus('APK check कर रहा हूं…');
  try {
    const res = await fetch(`https://api.github.com/repos/sarvan810355/phone-dashboard/releases/tags/apk-${encodeURIComponent(id)}`, {
      headers: { Accept: 'application/vnd.github+json' },
    });
    if (res.status === 404) { setStatus('अभी तक कोई APK build नहीं हुआ — पहले Work/Auto चलाएं'); return; }
    if (!res.ok) throw new Error('release fetch: ' + res.status);
    const rel = await res.json();
    const asset = rel.assets.find((a) => a.name.endsWith('.apk'));
    if (!asset) { setStatus('Release मिली पर APK file नहीं मिली'); return; }
    setStatus('Download शुरू हो रहा है… (' + Math.round(asset.size / 1024 / 1024) + ' MB)');
    const a = document.createElement('a');
    a.href = asset.browser_download_url;
    a.download = asset.name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setStatus('Download शुरू हो गया — notification में देखें');
  } catch (e) {
    setStatus('APK download error: ' + e.message);
  }
}

render();
refreshData();
setInterval(refreshData, 20000);
</script>
