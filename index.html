<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Project Agent</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px 16px 60px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0b0d10; color: #e8e8e8;
    max-width: 720px; margin-inline: auto;
  }
  h1 { font-size: 1.25rem; margin: 4px 0 14px; }
  h2 { font-size: 1.1rem; margin: 0; }
  .card {
    background: #16191d; border: 1px solid #262b31; border-radius: 12px;
    padding: 14px 16px; margin-bottom: 12px;
  }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .name { font-weight: 600; font-size: 1.05rem; }
  .badge {
    font-size: 0.72rem; padding: 3px 8px; border-radius: 999px;
    background: #2a2f36; color: #b8c0cc; white-space: nowrap; flex: 0 0 auto;
  }
  .badge.running { background: #163a2b; color: #5fd28c; }
  .badge.waiting, .badge.blocked { background: #3a2c16; color: #e0a94f; }
  .badge.completed { background: #16283a; color: #6fb3f2; }
  .badge.failed { background: #3a1620; color: #f26f8c; }
  .meta { font-size: 0.85rem; color: #98a2ad; margin-top: 6px; line-height: 1.4; }
  .resume { font-size: 0.82rem; color: #c9cfd6; margin-top: 8px; background: #101215; padding: 8px 10px; border-radius: 8px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  button {
    flex: 1; min-width: 80px; padding: 9px 10px; border-radius: 8px; border: none;
    background: #262b31; color: #e8e8e8; font-size: 0.85rem; font-weight: 500;
  }
  button:active { background: #333a42; }
  button.primary { background: #2b5fd9; color: white; }
  .addbox { display: none; flex-direction: column; gap: 8px; margin-top: 10px; }
  .addbox.open { display: flex; }
  input, textarea, select {
    width: 100%; background: #0f1114; border: 1px solid #2a2f36; color: #e8e8e8;
    border-radius: 8px; padding: 9px 10px; font-size: 0.9rem; font-family: inherit;
  }
  .newproj { display: flex; gap: 8px; margin-bottom: 16px; }
  .newproj input { flex: 1; }
  .empty { color: #7c8591; text-align: center; padding: 40px 0; }
  #status { position: fixed; bottom: 10px; left: 0; right: 0; text-align: center; font-size: 0.75rem; color: #667; }
  .gear { background: none; border: none; color: #98a2ad; font-size: 1.2rem; flex: 0 0 auto; min-width: auto; padding: 4px 8px; }
  .setup { display: flex; flex-direction: column; gap: 10px; }
  .setup label { font-size: 0.82rem; color: #98a2ad; }
  .hint { font-size: 0.78rem; color: #7c8591; line-height: 1.5; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .back { background: none; border: none; color: #6fb3f2; font-size: 0.95rem; padding: 4px 0; min-width: auto; flex: 0 0 auto; text-align: left; }

  /* project list rows */
  .plist { display: flex; flex-direction: column; gap: 8px; }
  .prow {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: #16191d; border: 1px solid #262b31; border-radius: 12px;
    padding: 14px 16px; cursor: pointer;
  }
  .prow:active { background: #1c2025; }
  .prow .name { font-size: 1rem; }
  .prow .sub { font-size: 0.78rem; color: #7c8591; margin-top: 3px; }
  .chev { color: #565e68; font-size: 1.1rem; flex: 0 0 auto; }

  .sectiontitle { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.04em; color: #7c8591; margin: 18px 0 8px; }
  .tasklist { display: flex; flex-direction: column; gap: 6px; }
  .taskrow { background: #101215; border-radius: 8px; padding: 8px 10px; font-size: 0.85rem; }
  .taskrow .ttitle { font-weight: 500; }
  .taskrow .tstatus { font-size: 0.7rem; color: #7c8591; margin-left: 6px; }

  .fieldrow { display: flex; gap: 6px; align-items: stretch; }
  .fieldrow input, .fieldrow textarea { flex: 1; }
  .mic {
    flex: 0 0 auto; width: 42px; min-width: 42px; padding: 0; font-size: 1.1rem;
    background: #262b31; border-radius: 8px;
  }
  .mic.listening { background: #5a1e1e; color: #ff8a8a; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
</style>
</head>
<body>

<div id="app"></div>
<div id="status"></div>

<script>
const CFG_KEY = 'pa_config';
function getConfig() { try { return JSON.parse(localStorage.getItem(CFG_KEY)) || {}; } catch { return {}; } }
function setConfig(c) { localStorage.setItem(CFG_KEY, JSON.stringify(c)); }

const DATA_DIR = 'projects';
const WORKFLOW = 'agent.yml';

function gh(path, opts = {}) {
  const c = getConfig();
  if (!c.owner || !c.repo || !c.token) throw new Error('पहले ⚙ में owner/repo/token भरें');
  return fetch(`https://api.github.com/repos/${c.owner}/${c.repo}${path}`, {
    method: opts.method || 'GET',
    headers: {
      Authorization: `Bearer ${c.token}`,
      Accept: 'application/vnd.github+json',
      ...(opts.body ? { 'Content-Type': 'application/json' } : {}),
    },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
}

async function listProjectIds() {
  const res = await gh(`/contents/${DATA_DIR}`);
  if (res.status === 404) return [];
  if (!res.ok) throw new Error('project list: ' + res.status);
  const items = await res.json();
  return items.filter((i) => i.type === 'dir').map((i) => i.name);
}

async function loadProject(id) {
  const res = await gh(`/contents/${DATA_DIR}/${id}/state.json`);
  if (!res.ok) return null;
  const file = await res.json();
  return JSON.parse(decodeURIComponent(escape(atob(file.content))));
}

async function dispatch(inputs) {
  const res = await gh(`/actions/workflows/${WORKFLOW}/dispatches`, {
    method: 'POST',
    body: { ref: 'main', inputs },
  });
  if (!res.ok) {
    const t = await res.text();
    throw new Error('trigger failed: ' + res.status + ' ' + t);
  }
}

function badgeClass(status) {
  if (['RUNNING', 'READY'].includes(status)) return 'running';
  if (['WAITING_FOR_RESOURCE', 'WAITING_FOR_USER', 'BLOCKED', 'PAUSED'].includes(status)) return 'waiting';
  if (status === 'COMPLETED') return 'completed';
  if (status === 'FAILED') return 'failed';
  return '';
}

function setStatus(msg) { document.getElementById('status').textContent = msg; }
function esc(s) { return (s || '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// ---------- routing ----------
function currentRoute() {
  const h = location.hash.replace(/^#/, '');
  if (h.startsWith('project/')) return { view: 'detail', id: decodeURIComponent(h.slice(8)) };
  return { view: 'list' };
}
function goTo(hash) { location.hash = hash; }
window.addEventListener('hashchange', render);

let projectsCache = [];

async function refreshData() {
  try {
    const ids = await listProjectIds();
    projectsCache = (await Promise.all(ids.map(loadProject))).filter(Boolean);
    setStatus('updated ' + new Date().toLocaleTimeString());
  } catch (e) {
    setStatus('error: ' + e.message);
  }
  // Don't wipe out whatever the user is currently typing (e.g. a new
  // project id or task title) when a background refresh lands mid-type.
  const active = document.activeElement;
  const isTyping = active && ['INPUT', 'TEXTAREA'].includes(active.tagName) && document.getElementById('app').contains(active);
  if (!isTyping) render();
}

// ---------- views ----------
function renderList() {
  const app = document.getElementById('app');
  const rows = projectsCache.map((p) => `
    <div class="prow" onclick="goTo('project/${encodeURIComponent(p.PROJECT_ID)}')">
      <div>
        <div class="name">${esc(p.PROJECT_NAME)}</div>
        <div class="sub">${p.CURRENT_TASK ? esc(p.CURRENT_TASK.TITLE) : (p.NEXT_TASK ? 'Next: ' + esc(p.NEXT_TASK) : 'कोई task queued नहीं')}</div>
      </div>
      <span class="badge ${badgeClass(p.PROJECT_STATUS)}">${p.PROJECT_STATUS}</span>
      <span class="chev">›</span>
    </div>
  `).join('');

  app.innerHTML = `
    <div class="topbar">
      <h1>Project Agent</h1>
      <button class="gear" onclick="toggleSetup()">⚙</button>
    </div>
    <div id="setupCard" class="card setup" style="display:none">
      <label>GitHub username/org</label>
      <input id="cfgOwner" placeholder="e.g. sarvan810355">
      <label>Repo name (the private data repo)</label>
      <input id="cfgRepo" placeholder="e.g. cloud-orchestrator">
      <label>Personal Access Token</label>
      <input id="cfgToken" type="password" placeholder="github_pat_...">
      <div class="hint">Token सिर्फ आपके फोन के browser में रहता है — सीधे GitHub API को जाता है।</div>
      <button class="primary" onclick="saveConfig()">Save</button>
    </div>
    <div class="card setup" style="flex-direction:row; flex-wrap:wrap; gap:8px">
      <input id="npId" style="flex:1; min-width:120px" placeholder="project id (e.g. recharge_checker)">
      <input id="npRepo" style="flex:1; min-width:150px" placeholder="owner/repo (optional, code link)">
      <button class="primary" style="flex:0 0 100%" onclick="createProject()">+ New Project</button>
    </div>
    <div class="sectiontitle">आपके projects</div>
    <div class="plist">${rows || '<div class="empty">कोई project नहीं है। ऊपर से नया बनाएं।</div>'}</div>
  `;

  const c = getConfig();
  document.getElementById('cfgOwner').value = c.owner || '';
  document.getElementById('cfgRepo').value = c.repo || '';
  document.getElementById('cfgToken').value = c.token || '';
  if (!c.token) document.getElementById('setupCard').style.display = 'flex';
}

function renderDetail(id) {
  const app = document.getElementById('app');
  const p = projectsCache.find((x) => x.PROJECT_ID === id);
  if (!p) {
    app.innerHTML = `<button class="back" onclick="goTo('')">‹ वापस</button><div class="empty">Project नहीं मिला, refresh करें।</div>`;
    return;
  }

  const queueRows = p.TASK_QUEUE.map((t) => `
    <div class="taskrow"><span class="ttitle">${esc(t.TITLE)}</span><span class="tstatus">${t.STATUS}</span></div>
  `).join('') || '<div class="taskrow">कोई task queued नहीं</div>';

  const doneRows = p.COMPLETED_TASKS.slice().reverse().map((t) => `
    <div class="taskrow"><span class="ttitle">✓ ${esc(t.TITLE)}</span></div>
  `).join('') || '<div class="taskrow">अभी तक कुछ पूरा नहीं हुआ</div>';

  app.innerHTML = `
    <button class="back" onclick="goTo('')">‹ सारे projects</button>
    <div class="topbar" style="margin-top:8px">
      <h2>${esc(p.PROJECT_NAME)}</h2>
      <span class="badge ${badgeClass(p.PROJECT_STATUS)}">${p.PROJECT_STATUS}</span>
    </div>
    <div class="card">
      <div class="meta">
        Current: ${p.CURRENT_TASK ? esc(p.CURRENT_TASK.TITLE) : '—'}<br>
        Next: ${p.NEXT_TASK || '—'}<br>
        Code repo: ${p.REPO ? `<a href="https://github.com/${p.REPO}" style="color:#6fb3f2" target="_blank">${p.REPO}</a>` : 'not linked'}
      </div>
      ${p.RESUME_POINT ? `<div class="resume">${esc(p.RESUME_POINT)}</div>` : ''}
      <div class="actions">
        <button onclick="work('${p.PROJECT_ID}')">Work (1 task)</button>
        <button onclick="autoRun('${p.PROJECT_ID}')">Auto</button>
        <button onclick="toggleAdd('${p.PROJECT_ID}')">+ Task</button>
      </div>
      <div class="addbox" id="add-${p.PROJECT_ID}">
        <div class="fieldrow">
          <input id="title-${p.PROJECT_ID}" placeholder="Task title">
          <button type="button" class="mic" id="mic-title-${p.PROJECT_ID}" onclick="startVoice('title-${p.PROJECT_ID}')">🎤</button>
        </div>
        <div class="fieldrow">
          <textarea id="desc-${p.PROJECT_ID}" rows="2" placeholder="Description"></textarea>
          <button type="button" class="mic" id="mic-desc-${p.PROJECT_ID}" onclick="startVoice('desc-${p.PROJECT_ID}')">🎤</button>
        </div>
        <button class="primary" onclick="addTask('${p.PROJECT_ID}')">Add task</button>
      </div>
      <div class="actions">
        <button onclick="downloadApk('${p.PROJECT_ID}')">📥 Download APK</button>
      </div>
    </div>

    <div class="sectiontitle">Queue (${p.TASK_QUEUE.length})</div>
    <div class="tasklist">${queueRows}</div>

    <div class="sectiontitle">Completed (${p.COMPLETED_TASKS.length})</div>
    <div class="tasklist">${doneRows}</div>
  `;
}

function render() {
  const r = currentRoute();
  if (r.view === 'detail') renderDetail(r.id);
  else renderList();
}

// ---------- actions ----------
function toggleSetup() {
  const card = document.getElementById('setupCard');
  card.style.display = card.style.display === 'none' ? 'flex' : 'none';
}
function saveConfig() {
  setConfig({
    owner: document.getElementById('cfgOwner').value.trim(),
    repo: document.getElementById('cfgRepo').value.trim(),
    token: document.getElementById('cfgToken').value.trim(),
  });
  refreshData();
}
function toggleAdd(id) { document.getElementById('add-' + id).classList.toggle('open'); }

async function addTask(id) {
  const title = document.getElementById('title-' + id).value.trim();
  const description = document.getElementById('desc-' + id).value.trim();
  if (!title) return;
  setStatus('queuing task on GitHub Actions…');
  await dispatch({ action: 'add-task', projectId: id, title, description });
  setStatus('task queued — ~30-60s में state update होगा।');
}

async function createProject() {
  const id = document.getElementById('npId').value.trim();
  const repo = document.getElementById('npRepo').value.trim();
  if (!id) return;
  setStatus('creating project on GitHub Actions…');
  await dispatch({ action: 'init', projectId: id, repo });
  setStatus('project create queued — थोड़ी देर बाद refresh करें।');
}

async function work(id) { setStatus('running one task cycle in the cloud…'); await dispatch({ action: 'work', projectId: id }); setStatus('cycle queued — ~30-90s में repo update होगा।'); }
async function autoRun(id) { setStatus('running cycles in the cloud…'); await dispatch({ action: 'auto', projectId: id, maxCycles: '20' }); setStatus('auto run queued — कुछ मिनट लग सकते हैं।'); }

// ---------- voice input ----------
function startVoice(fieldId) {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) { setStatus('इस browser में voice input support नहीं है (Chrome try करें)'); return; }
  const rec = new SpeechRecognition();
  rec.lang = (navigator.language && navigator.language.startsWith('hi')) ? 'hi-IN' : 'en-IN';
  rec.interimResults = false;
  rec.maxAlternatives = 1;
  const btn = document.getElementById('mic-' + fieldId);
  const field = document.getElementById(fieldId);
  if (btn) btn.classList.add('listening');
  setStatus('सुन रहा हूं… बोलिए');
  rec.onresult = (e) => {
    const text = e.results[0][0].transcript;
    if (field) field.value = (field.value ? field.value.trim() + ' ' : '') + text;
    setStatus('voice text जोड़ा गया');
  };
  rec.onerror = (e) => setStatus('voice error: ' + e.error);
  rec.onend = () => { if (btn) btn.classList.remove('listening'); };
  rec.start();
}

// ---------- APK download ----------
async function downloadApk(id) {
  const c = getConfig();
  const p = projectsCache.find((x) => x.PROJECT_ID === id);
  if (!p || !p.REPO) { setStatus('इस project से कोई code repo linked नहीं है'); return; }
  setStatus('APK ढूंढ रहा हूं…');
  try {
    const relRes = await fetch(`https://api.github.com/repos/${p.REPO}/releases/tags/latest`, {
      headers: { Authorization: `Bearer ${c.token}`, Accept: 'application/vnd.github+json' },
    });
    if (relRes.status === 404) { setStatus('अभी तक कोई APK build नहीं हुआ — पहले Work/Auto चलाएं'); return; }
    if (!relRes.ok) throw new Error('release fetch: ' + relRes.status);
    const rel = await relRes.json();
    const asset = rel.assets.find((a) => a.name.endsWith('.apk'));
    if (!asset) { setStatus('Release मिली पर APK file नहीं मिली'); return; }
    setStatus('Download हो रहा है… (' + Math.round(asset.size / 1024 / 1024) + ' MB)');
    const assetRes = await fetch(asset.url, {
      headers: { Authorization: `Bearer ${c.token}`, Accept: 'application/octet-stream' },
    });
    if (!assetRes.ok) throw new Error('asset fetch: ' + assetRes.status);
    const blob = await assetRes.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = asset.name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    setStatus('Download शुरू हो गया — notification में देखें');
  } catch (e) {
    setStatus('APK download error: ' + e.message);
  }
}

render();
refreshData();
setInterval(refreshData, 20000);
</script>
</body>
</html>
